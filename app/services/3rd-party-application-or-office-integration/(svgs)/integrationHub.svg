<!-- app/services/by-business-solution/3rd-party-application-or-office-integration/(svgs)/integrationHub.svg -->
<!-- Office apps on the left, the integration layer in the centre, 3rd party apps on the right. -->
<!-- Colours are set once in the :root block below. Swap these hex values for the globals.scss palette. -->
<!-- Animation is CSS only (no scripts) and switches off for visitors who prefer reduced motion. -->
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" role="img" aria-labelledby="hubTitle hubDesc">
  <title id="hubTitle">Microsoft Office connected to your business apps</title>
  <desc id="hubDesc">Excel, Word, Access and PowerPoint send data through an integration layer using API, ODBC and Graph to Salesforce, Xero, MYOB and SQL Server.</desc>

  <style>
    :root { --primary: #0b5cab; --primary-dark: #083f78; --accent: #e8590c; --surface: #f1f5fa; --line: #b8c7d9; --text: #1c2733; --ok: #2eb872; }

    /* Static shapes */
    .panel { fill: var(--surface); opacity: 0.6; }
    .pill { fill: #fff; stroke: var(--line); filter: url(#soft); }
    .node { fill: #fff; stroke: var(--line); stroke-width: 2; }
    .link { stroke: var(--line); stroke-width: 2; fill: none; opacity: 0.55; }
    .flowL { stroke: var(--primary); stroke-width: 2; stroke-dasharray: 3 9; stroke-linecap: round; fill: none; animation: flow 1.2s linear infinite; }
    .flowR { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 3 9; stroke-linecap: round; fill: none; animation: flow 1.2s linear infinite; }
    .hub { fill: url(#hubGrad); filter: url(#hubShadow); }
    .chip { fill: #fff; fill-opacity: 0.16; }
    .orbit { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 2 7; stroke-linecap: round; }

    /* Text */
    text { font-family: system-ui, sans-serif; font-size: 15px; fill: var(--text); text-anchor: middle; }
    .label { font-size: 11px; fill: var(--primary); font-weight: 700; letter-spacing: 1px; }
    .name { font-size: 13px; font-weight: 600; text-anchor: start; }
    .ico { fill: #fff; font-size: 13px; font-weight: 700; }
    .hubText { fill: #fff; font-weight: 700; font-size: 14px; text-anchor: start; }
    .hubSub { fill: #fff; font-size: 12px; text-anchor: start; }
    .status { font-size: 12px; fill: var(--primary); font-weight: 600; text-anchor: start; }

    /* Dashes drift along each path in its drawing direction */
    @keyframes flow { to { stroke-dashoffset: -24; } }

    /* A data packet runs the length of its path, then waits while the other side takes its turn */
    .packet { offset-rotate: 0deg; opacity: 0; animation: travel 4s ease-in-out infinite; }
    @keyframes travel {
      0%   { offset-distance: 0%;   opacity: 0; }
      4%   { opacity: 1; }
      40%  { offset-distance: 100%; opacity: 1; }
      44%  { offset-distance: 100%; opacity: 0; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    /* Rings expanding from the hub */
    .ring { fill: none; stroke: var(--primary); stroke-width: 2; opacity: 0; transform-origin: 260px 210px; animation: pulse 3s ease-out infinite; }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.45; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    /* Orbiting dots around the hub */
    .spin { transform-origin: 260px 210px; animation: spin 18s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status lights */
    .dot { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* Pills glow as a packet leaves or arrives */
    .flash { fill: none; stroke-width: 2.5; opacity: 0; animation: flash 4s ease-out infinite; }
    .flash.send { stroke: var(--primary); }
    .flash.recv { stroke: var(--accent); }
    @keyframes flash {
      0%   { opacity: 0; }
      4%   { opacity: 1; }
      20%  { opacity: 0; }
      100% { opacity: 0; }
    }

    /* Apps rise into place on load */
    .app { transform-box: fill-box; transform-origin: center; animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.95); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a78d0" />
      <stop offset="1" stop-color="#083f78" />
    </linearGradient>
    <filter id="hubShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b5cab" flood-opacity="0.35" />
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1c2733" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Column backdrops and labels -->
  <rect class="panel" x="2" y="38" width="136" height="344" rx="18" />
  <rect class="panel" x="382" y="38" width="136" height="344" rx="18" />
  <text class="label" x="70" y="28">OFFICE</text>
  <text class="label" x="450" y="28">YOUR BUSINESS APPS</text>

  <!-- Decorative orbit around the hub, sits behind the lines -->
  <g class="spin">
    <circle class="orbit" cx="260" cy="210" r="88" />
    <circle cx="348" cy="210" r="4" fill="var(--primary)" />
    <circle cx="216" cy="286.2" r="4" fill="var(--accent)" />
    <circle cx="216" cy="133.8" r="4" fill="var(--line)" />
  </g>

  <!-- Connection lines, drawn first so the pills sit on top -->
  <g>
    <path class="link" d="M130 70 C190 70 190 210 215 210" />
    <path class="link" d="M130 150 C180 150 190 210 215 210" />
    <path class="link" d="M130 270 C180 270 190 210 215 210" />
    <path class="link" d="M130 350 C190 350 190 210 215 210" />
    <path class="link" d="M305 210 C330 210 330 70 390 70" />
    <path class="link" d="M305 210 C330 210 330 150 390 150" />
    <path class="link" d="M305 210 C330 210 330 270 390 270" />
    <path class="link" d="M305 210 C330 210 330 350 390 350" />
  </g>
  <g>
    <path class="flowL" d="M130 70 C190 70 190 210 215 210" />
    <path class="flowL" d="M130 150 C180 150 190 210 215 210" />
    <path class="flowL" d="M130 270 C180 270 190 210 215 210" />
    <path class="flowL" d="M130 350 C190 350 190 210 215 210" />
    <path class="flowR" d="M305 210 C330 210 330 70 390 70" />
    <path class="flowR" d="M305 210 C330 210 330 150 390 150" />
    <path class="flowR" d="M305 210 C330 210 330 270 390 270" />
    <path class="flowR" d="M305 210 C330 210 330 350 390 350" />
  </g>

  <!-- Line end points -->
  <circle class="node" cx="130" cy="70" r="4" />
  <circle class="node" cx="130" cy="150" r="4" />
  <circle class="node" cx="130" cy="270" r="4" />
  <circle class="node" cx="130" cy="350" r="4" />
  <circle class="node" cx="390" cy="70" r="4" />
  <circle class="node" cx="390" cy="150" r="4" />
  <circle class="node" cx="390" cy="270" r="4" />
  <circle class="node" cx="390" cy="350" r="4" />

  <!-- Data packets: Office to hub (blue), then hub to business apps (orange). Right-hand delays = left delay + 1.8s -->
  <g class="packet" style="offset-path: path('M130 70 C190 70 190 210 215 210'); animation-delay: 0s">
    <circle r="7" fill="var(--primary)" opacity="0.25" /><circle r="3.5" fill="var(--primary)" />
  </g>
  <g class="packet" style="offset-path: path('M130 150 C180 150 190 210 215 210'); animation-delay: 0.6s">
    <circle r="7" fill="var(--primary)" opacity="0.25" /><circle r="3.5" fill="var(--primary)" />
  </g>
  <g class="packet" style="offset-path: path('M130 270 C180 270 190 210 215 210'); animation-delay: 1.2s">
    <circle r="7" fill="var(--primary)" opacity="0.25" /><circle r="3.5" fill="var(--primary)" />
  </g>
  <g class="packet" style="offset-path: path('M130 350 C190 350 190 210 215 210'); animation-delay: 1.8s">
    <circle r="7" fill="var(--primary)" opacity="0.25" /><circle r="3.5" fill="var(--primary)" />
  </g>
  <g class="packet" style="offset-path: path('M305 210 C330 210 330 70 390 70'); animation-delay: 1.8s">
    <circle r="7" fill="var(--accent)" opacity="0.25" /><circle r="3.5" fill="var(--accent)" />
  </g>
  <g class="packet" style="offset-path: path('M305 210 C330 210 330 150 390 150'); animation-delay: 2.4s">
    <circle r="7" fill="var(--accent)" opacity="0.25" /><circle r="3.5" fill="var(--accent)" />
  </g>
  <g class="packet" style="offset-path: path('M305 210 C330 210 330 270 390 270'); animation-delay: 3s">
    <circle r="7" fill="var(--accent)" opacity="0.25" /><circle r="3.5" fill="var(--accent)" />
  </g>
  <g class="packet" style="offset-path: path('M305 210 C330 210 330 350 390 350'); animation-delay: 3.6s">
    <circle r="7" fill="var(--accent)" opacity="0.25" /><circle r="3.5" fill="var(--accent)" />
  </g>

  <!-- Office apps (generic letter badges, not vendor logos) -->
  <g class="app" style="animation-delay: 0.1s">
    <rect class="pill" x="10" y="50" width="120" height="40" rx="20" />
    <rect class="flash send" x="10" y="50" width="120" height="40" rx="20" style="animation-delay: 0s" />
    <rect x="20" y="59" width="22" height="22" rx="6" fill="#1d6f42" />
    <text class="ico" x="31" y="75">X</text>
    <text class="name" x="51" y="75">Excel</text>
  </g>
  <g class="app" style="animation-delay: 0.2s">
    <rect class="pill" x="10" y="130" width="120" height="40" rx="20" />
    <rect class="flash send" x="10" y="130" width="120" height="40" rx="20" style="animation-delay: 0.6s" />
    <rect x="20" y="139" width="22" height="22" rx="6" fill="#2b579a" />
    <text class="ico" x="31" y="155">W</text>
    <text class="name" x="51" y="155">Word</text>
  </g>
  <g class="app" style="animation-delay: 0.3s">
    <rect class="pill" x="10" y="250" width="120" height="40" rx="20" />
    <rect class="flash send" x="10" y="250" width="120" height="40" rx="20" style="animation-delay: 1.2s" />
    <rect x="20" y="259" width="22" height="22" rx="6" fill="#a4373a" />
    <text class="ico" x="31" y="275">A</text>
    <text class="name" x="51" y="275">Access</text>
  </g>
  <g class="app" style="animation-delay: 0.4s">
    <rect class="pill" x="10" y="330" width="120" height="40" rx="20" />
    <rect class="flash send" x="10" y="330" width="120" height="40" rx="20" style="animation-delay: 1.8s" />
    <rect x="20" y="339" width="22" height="22" rx="6" fill="#d35230" />
    <text class="ico" x="31" y="355">P</text>
    <text class="name" x="51" y="355">PowerPoint</text>
  </g>

  <!-- Integration layer -->
  <rect class="ring" x="215" y="150" width="90" height="120" rx="16" />
  <rect class="ring" x="215" y="150" width="90" height="120" rx="16" style="animation-delay: 1.5s" />
  <rect class="hub" x="215" y="150" width="90" height="120" rx="16" />

  <rect class="chip" x="226" y="166" width="68" height="26" rx="13" />
  <rect class="chip" x="226" y="198" width="68" height="26" rx="13" />
  <rect class="chip" x="226" y="230" width="68" height="26" rx="13" />
  <circle class="dot" cx="240" cy="179" r="3.5" fill="var(--ok)" />
  <circle class="dot" cx="240" cy="211" r="3.5" fill="var(--ok)" style="animation-delay: 0.8s" />
  <circle class="dot" cx="240" cy="243" r="3.5" fill="var(--ok)" style="animation-delay: 1.6s" />
  <text class="hubText" x="251" y="184">API</text>
  <text class="hubSub" x="251" y="215">ODBC</text>
  <text class="hubSub" x="251" y="247">Graph</text>

  <!-- 3rd party apps -->
  <g class="app" style="animation-delay: 0.5s">
    <rect class="pill" x="390" y="50" width="120" height="40" rx="20" />
    <rect class="flash recv" x="390" y="50" width="120" height="40" rx="20" style="animation-delay: 3.4s" />
    <rect x="400" y="59" width="22" height="22" rx="6" fill="#00a1e0" />
    <text class="ico" x="411" y="75">S</text>
    <text class="name" x="431" y="75">Salesforce</text>
  </g>
  <g class="app" style="animation-delay: 0.6s">
    <rect class="pill" x="390" y="130" width="120" height="40" rx="20" />
    <rect class="flash recv" x="390" y="130" width="120" height="40" rx="20" style="animation-delay: 4s" />
    <rect x="400" y="139" width="22" height="22" rx="11" fill="#13b5ea" />
    <text class="ico" x="411" y="155">X</text>
    <text class="name" x="431" y="155">Xero</text>
  </g>
  <g class="app" style="animation-delay: 0.7s">
    <rect class="pill" x="390" y="250" width="120" height="40" rx="20" />
    <rect class="flash recv" x="390" y="250" width="120" height="40" rx="20" style="animation-delay: 4.6s" />
    <rect x="400" y="259" width="22" height="22" rx="6" fill="#6b3fa0" />
    <text class="ico" x="411" y="275">M</text>
    <text class="name" x="431" y="275">MYOB</text>
  </g>
  <g class="app" style="animation-delay: 0.8s">
    <rect class="pill" x="390" y="330" width="120" height="40" rx="20" />
    <rect class="flash recv" x="390" y="330" width="120" height="40" rx="20" style="animation-delay: 5.2s" />
    <rect x="400" y="339" width="22" height="22" rx="6" fill="#5b6b7c" />
    <!-- Simple database cylinder icon -->
    <path d="M405 346 v8 c0 2 12 2 12 0 v-8 M405 350 c0 2 12 2 12 0" fill="none" stroke="#fff" stroke-width="1.4" />
    <ellipse cx="411" cy="346" rx="6" ry="2" fill="none" stroke="#fff" stroke-width="1.4" />
    <text class="name" x="431" y="355">SQL Server</text>
  </g>

  <!-- Status strip -->
  <rect x="190" y="390" width="140" height="24" rx="12" fill="var(--surface)" stroke="var(--line)" />
  <circle class="dot" cx="208" cy="402" r="4" fill="var(--ok)" />
  <text class="status" x="220" y="406">Live data sync</text>
</svg>